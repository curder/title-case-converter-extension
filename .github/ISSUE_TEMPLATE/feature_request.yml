name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请描述需求背景与期望结果，便于评估可行性与取舍。
  - type: textarea
    id: background
    attributes:
      label: 背景与问题
      description: 当前遇到了什么问题？为什么现有功能不够用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望扩展如何表现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
      description: 你考虑过的其他做法，或可能受影响的现有行为。
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 满足哪些条件可以认为该需求完成？
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
